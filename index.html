<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body class="page-home">
    <section id="fv" class="fv">
      <div class="l-menu fv__menu">
        <div class="fv__logo">
          <a class="en" href="#">WDC</a>
        </div>
        <ul class="fv__menu__list">
          <li class="fv__menu__item"><a class="en" href="#">ABOUT</a></li>
          <li class="fv__menu__item"><a class="en" href="#">SPEAKER</a></li>
          <li class="fv__menu__item"><a class="en" href="#">SESSION</a></li>
        </ul>
      </div>
      <div class="fv__text__area">
        <h1 class="fv__title">
          <span class="wdc en">Web Design Conference vol.24</span>
          <span class="work">WORK<br />REVOLUTION</span>
        </h1>
        <time class="fv__time" datetime="2030-05-30">2030.05.30</time>
        <a href="#" class="fv__btn"> お申し込み </a>
      </div>
      <div class="fv__teiji">
        <img src="src/images/teiji-de-kaerumon.png" alt="定時で帰るもん" />
      </div>
      <div class="fv__shawn">
        <img src="src/images/mv.png" alt="ショーンの画像" />
      </div>
    </section>
    <section id="about" class="about">
      <div class="inner">
        <h2 class="about__title">
          <span class="en section-title">ABOUT</span>
          <span class="section-subtitle">イベントについて</span>
        </h2>
        <div class="about__container l-menu">
          <div class="about__img-area">
            <img src="./src/images/about.png" alt="" />
          </div>
          <div class="about__text-area">
            <h3 class="about__subtitle">
              <span class="about__subtitle-label">テーマ</span>
              <span class="about__subtitle-main">定時で帰る</span>
            </h3>
            <p class="about__text">
              残業は心と体に良くないです。世界最速で定時に帰る男、ショーン・デイビット・ジュニア氏が定時で帰るためのスペシャルな技を紹介！
              さぁ、Let's go home now!
            </p>
            <dl class="about__info">
              <dt>日時</dt>
              <dd>2030年5月30日（土） 13:00-翌朝13:00</dd>
              <dt>会場</dt>
              <dd>オンライン</dd>
              <dt>定員</dt>
              <dd>3名</dd>
              <dt>参加費</dt>
              <dd>無料</dd>
            </dl>
            <a href="#" class="about__btn"> お申し込み </a>
          </div>
        </div>
      </div>
    </section>
    <section id="speaker" class="speaker"></section>
    <section id="session" class="session"></section>
    <section id="registor" class="registor"></section>
    <footer id="footer" class="footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
